<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Gastos - Canoas Gás</title>
    <link rel="icon" type="image/x-icon"
        href="https://github.com/otaviogabrielbh-cloud/projeto-gas/raw/refs/heads/main/LOGO.ico">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2ecc71;
            --secondary: #27ae60;
            --danger: #ef4444;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --bg-light: #f8fafc;
            --bg-card: #ffffff;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .gastos-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }

        .gastos-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: var(--bg-card);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .gastos-header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--text-dark);
        }

        .gastos-header h1 span {
            color: var(--danger);
        }

        .btn-voltar {
            background: var(--text-light);
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-voltar:hover {
            background: var(--text-dark);
        }

        .gastos-form {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .form-title {
            color: var(--text-dark);
            font-family: 'Outfit';
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 20px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .form-row .input-group {
            flex: 1;
            min-width: 180px;
        }

        .input-group label {
            color: var(--text-light);
            font-size: 12px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 8px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            background: var(--bg-light);
            border: 1px solid var(--border);
            color: var(--text-dark);
            border-radius: 12px;
            padding: 12px;
            font-family: 'Outfit';
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--primary);
        }

        .btn-save {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 15px;
            width: 100%;
        }

        .btn-save:hover {
            transform: scale(1.02);
        }

        .gastos-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
            background: var(--bg-card);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .filter-group label {
            color: var(--text-light);
            font-size: 11px;
            text-transform: uppercase;
        }

        .filter-group input,
        .filter-group select {
            background: var(--bg-light);
            border: 1px solid var(--border);
            color: var(--text-dark);
            border-radius: 8px;
            padding: 10px;
            font-family: 'Outfit';
            font-size: 13px;
        }

        .btn-excel {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-excel:hover {
            transform: scale(1.05);
        }

        .total-gastos {
            font-size: 22px;
            font-weight: 800;
            color: var(--danger);
        }

        .gastos-table-section {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow-x: auto;
        }

        .gastos-table-section table {
            width: 100%;
            border-collapse: collapse;
        }

        .gastos-table-section th {
            text-align: left;
            padding: 15px;
            border-bottom: 2px solid var(--border);
            color: var(--text-light);
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .gastos-table-section td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            color: var(--text-dark);
        }

        .val-gasto {
            color: var(--danger);
            font-weight: 700;
        }

        .btn-excluir {
            background: var(--danger);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-excluir:hover {
            background: #dc2626;
        }

        .btn-editar {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-editar:hover {
            background: #2563eb;
        }

        .btn-cancel {
            background: var(--text-light);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
            width: 100%;
        }

        .btn-cancel:hover {
            background: var(--text-dark);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .loading-overlay .stat-value {
            color: var(--primary);
            font-size: 20px;
        }

        .charts-wrapper {
            display: grid;
            grid-template-columns: 1.2fr 2fr;
            gap: 20px;
            margin-top: 20px;
            align-items: center;
        }

        .chart-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        @media (max-width: 768px) {
            .charts-wrapper {
                grid-template-columns: 1fr;
            }
        }

        .input-grupo-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            align-items: flex-end;
        }

        .input-grupo-row .input-group {
            flex: 1;
        }

        .input-grupo-row .btn-save {
            width: auto;
            margin-top: 0;
        }

        .btn-add-grupo {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%) !important;
            color: white !important;
            border: none !important;
            border-radius: 6px !important;
            padding: 0 !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            font-size: 14px !important;
            width: 28px !important;
            height: 28px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            min-width: 28px !important;
        }

        .form-title-small {
            color: var(--text-dark);
            font-family: 'Outfit';
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .grupo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .grupo-item-nome {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .grupo-actions {
            display: flex;
            gap: 5px;
        }

            color: var(--text-dark);
            font-family: 'Outfit';
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
    </style>
    <!-- VPS Socket.IO & Adapter (Primeiros Scripts) -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/vps-adapter.js"></script>
</head>

<body>
    <div id="loading" class="loading-overlay">
        <div class="stat-value">CARREGANDO GASTOS...</div>
    </div>

    <div class="gastos-container">
        <header class="gastos-header">
            <h1>📋 <span>LISTA DE GASTOS</span></h1>
            <a href="index.html" class="btn-voltar">⬅ VOLTAR</a>
        </header>

        <div class="gastos-form" style="margin-bottom: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div class="form-title" id="tituloFormularioGasto" style="margin: 0;">➕ Cadastrar Novo Gasto</div>
                <button class="btn-add-grupo" onclick="toggleFormGrupo()" style="width:24px!important;height:28px!important;min-width:24px!important;padding:0!important;font-size:14px!important;">🏷️</button>
            </div>
            <div id="formNovoGrupo" style="display: none; flex-direction: column; margin-bottom: 15px; padding: 15px; background: var(--bg-light); border-radius: 12px;">
                <div class="input-grupo-row" style="margin-top: 0; align-items: flex-end; width: 100%;">
                    <div class="input-group">
                        <label id="lblNovoGrupo">Novo Grupo</label>
                        <input type="text" id="novoGrupoNome" placeholder="Ex: Manutenção">
                    </div>
                    <button class="btn-save" id="btnSalvarGrupo" style="width: auto; margin: 0; padding: 12px 20px;" onclick="salvarGrupo()">SALVAR</button>
                    <button class="btn-cancel" id="btnCancelarEdicaoGrupo" style="display: none; width: auto; margin: 0; padding: 12px 20px; border-radius: 12px;" onclick="cancelarEdicaoGrupo()">CANCELAR</button>
                </div>
                <div id="listaGruposCadastrados" style="margin-top: 15px; display: flex; flex-direction: column; gap: 5px; max-height: 150px; overflow-y: auto;">
                    <!-- Grupos renderizados aqui -->
                </div>
            </div>
            <div class="form-row">
                <div class="input-group">
                    <label>💰 Valor (R$)</label>
                    <input type="number" id="gastoValor" step="0.01" placeholder="0,00">
                </div>
                <div class="input-group">
                    <label>📝 Descrição</label>
                    <input type="text" id="gastoDescricao" placeholder="Ex: Combustível, Material">
                </div>
                <div class="input-group">
                    <label>🏷️ Grupo</label>
                    <select id="gastoGrupo">
                        <option value="">Sem grupo</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>💳 Forma de Pagamento</label>
                    <select id="gastoFormaPagamento">
                        <option value="PIX">PIX</option>
                        <option value="Dinheiro">Dinheiro</option>
                        <option value="Débito">Débito</option>
                        <option value="Crédito">Crédito</option>
                        <option value="Boleto">Boleto</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>📅 Data do Gasto</label>
                    <input type="date" id="gastoData">
                </div>
            </div>
            <button class="btn-save" id="btnSalvarGasto" onclick="salvarGasto()">💾 CADASTRAR GASTO</button>
            <button class="btn-cancel" id="btnCancelarEdicao" onclick="cancelarEdicao()" style="display: none;">❌ CANCELAR EDIÇÃO</button>
        </div>

        <div class="gastos-summary">
            <div class="filter-group">
                <div>
                    <label>📅 Data Início</label>
                    <input type="date" id="gastoDataInicio">
                </div>
                <div>
                    <label>📅 Data Fim</label>
                    <input type="date" id="gastoDataFim">
                </div>
                <button class="btn-excel" onclick="exportarExcelGastos()">📊 Exportar Excel</button>
            </div>
            <div class="total-gastos">Total: <span id="totalGastosFiltrado">R$ 0,00</span></div>
        </div>

        <div class="gastos-form" style="margin-bottom: 20px; padding: 15px 24px;">
            <div class="filter-group" style="width: 100%; display: flex; gap: 15px; flex-wrap: wrap;">
                <div style="flex: 2; min-width: 250px;">
                    <label>🔍 Buscar Gasto Cadastrado</label>
                    <input type="text" id="gastoBuscaDescricao" list="listaDescricoesGastos" placeholder="Digite para buscar gasto ou selecione na lista..." style="width: 100%;">
                    <datalist id="listaDescricoesGastos"></datalist>
                </div>
                <div style="flex: 1; min-width: 200px;">
                    <label>🏷️ Filtrar por Grupo</label>
                    <select id="filtroGrupoGasto" style="width: 100%; box-sizing: border-box;">
                        <option value="">Todos os grupos</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="gastos-form" style="margin-bottom: 20px;">
            <div class="form-title-small">📊 GASTOS POR GRUPO</div>
            <div class="charts-wrapper">
                <div class="chart-container" style="max-width: 400px; margin: 0 auto;">
                    <canvas id="chartGastosGrupo"></canvas>
                </div>
                <div class="chart-container" style="width: 100%; margin: 0 auto;">
                    <canvas id="chartGastosGrupoBar"></canvas>
                </div>
            </div>
        </div>

        <div class="gastos-table-section">
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Descrição</th>
                        <th>Grupo</th>
                        <th>Forma Pagamento</th>
                        <th>Valor</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="corpoTabelaGastos">
                </tbody>
            </table>
        </div>
    </div>

    
</body>

</html>
