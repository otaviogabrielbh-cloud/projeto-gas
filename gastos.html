<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Gastos - Canoas Gás</title>
    <link rel="icon" type="image/x-icon"
        href="https://github.com/otaviogabrielbh-cloud/projeto-gas/raw/refs/heads/main/LOGO.ico">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2ecc71;
            --secondary: #27ae60;
            --danger: #ef4444;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --bg-light: #f8fafc;
            --bg-card: #ffffff;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .gastos-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }

        .gastos-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: var(--bg-card);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .gastos-header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--text-dark);
        }

        .gastos-header h1 span {
            color: var(--danger);
        }

        .btn-voltar {
            background: var(--text-light);
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-voltar:hover {
            background: var(--text-dark);
        }

        .gastos-form {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .form-title {
            color: var(--text-dark);
            font-family: 'Outfit';
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 20px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .form-row .input-group {
            flex: 1;
            min-width: 180px;
        }

        .input-group label {
            color: var(--text-light);
            font-size: 12px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 8px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            background: var(--bg-light);
            border: 1px solid var(--border);
            color: var(--text-dark);
            border-radius: 12px;
            padding: 12px;
            font-family: 'Outfit';
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--primary);
        }

        .btn-save {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 15px;
            width: 100%;
        }

        .btn-save:hover {
            transform: scale(1.02);
        }

        .gastos-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
            background: var(--bg-card);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .filter-group label {
            color: var(--text-light);
            font-size: 11px;
            text-transform: uppercase;
        }

        .filter-group input,
        .filter-group select {
            background: var(--bg-light);
            border: 1px solid var(--border);
            color: var(--text-dark);
            border-radius: 8px;
            padding: 10px;
            font-family: 'Outfit';
            font-size: 13px;
        }

        .btn-excel {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-excel:hover {
            transform: scale(1.05);
        }

        .total-gastos {
            font-size: 22px;
            font-weight: 800;
            color: var(--danger);
        }

        .gastos-table-section {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow-x: auto;
        }

        .gastos-table-section table {
            width: 100%;
            border-collapse: collapse;
        }

        .gastos-table-section th {
            text-align: left;
            padding: 15px;
            border-bottom: 2px solid var(--border);
            color: var(--text-light);
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .gastos-table-section td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            color: var(--text-dark);
        }

        .val-gasto {
            color: var(--danger);
            font-weight: 700;
        }

        .btn-excluir {
            background: var(--danger);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-excluir:hover {
            background: #dc2626;
        }

        .btn-editar {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-editar:hover {
            background: #2563eb;
        }

        .btn-cancel {
            background: var(--text-light);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
            width: 100%;
        }

        .btn-cancel:hover {
            background: var(--text-dark);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .loading-overlay .stat-value {
            color: var(--primary);
            font-size: 20px;
        }

        .charts-wrapper {
            display: grid;
            grid-template-columns: 1.2fr 2fr;
            gap: 20px;
            margin-top: 20px;
            align-items: center;
        }

        .chart-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        @media (max-width: 768px) {
            .charts-wrapper {
                grid-template-columns: 1fr;
            }
        }

        .input-grupo-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            align-items: flex-end;
        }

        .input-grupo-row .input-group {
            flex: 1;
        }

        .input-grupo-row .btn-save {
            width: auto;
            margin-top: 0;
        }

        .btn-add-grupo {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%) !important;
            color: white !important;
            border: none !important;
            border-radius: 6px !important;
            padding: 0 !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            font-size: 14px !important;
            width: 28px !important;
            height: 28px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            min-width: 28px !important;
        }

        .form-title-small {
            color: var(--text-dark);
            font-family: 'Outfit';
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .grupo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .grupo-item-nome {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .grupo-actions {
            display: flex;
            gap: 5px;
        }
    </style>
    <!-- VPS Socket.IO & Adapter (Primeiros Scripts) -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/vps-adapter.js"></script>
</head>

<body>
    <div id="loading" class="loading-overlay">
        <div class="stat-value">CARREGANDO GASTOS...</div>
    </div>

    <div class="gastos-container">
        <header class="gastos-header">
            <h1>📋 <span>LISTA DE GASTOS</span></h1>
            <a href="index.html" class="btn-voltar">⬅ VOLTAR</a>
        </header>

        <div class="gastos-form" style="margin-bottom: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div class="form-title" id="tituloFormularioGasto" style="margin: 0;">➕ Cadastrar Novo Gasto</div>
                <button class="btn-add-grupo" onclick="toggleFormGrupo()" style="width:24px!important;height:28px!important;min-width:24px!important;padding:0!important;font-size:14px!important;">🏷️</button>
            </div>
            <div id="formNovoGrupo" style="display: none; flex-direction: column; margin-bottom: 15px; padding: 15px; background: var(--bg-light); border-radius: 12px;">
                <div class="input-grupo-row" style="margin-top: 0; align-items: flex-end; width: 100%;">
                    <div class="input-group">
                        <label id="lblNovoGrupo">Novo Grupo</label>
                        <input type="text" id="novoGrupoNome" placeholder="Ex: Manutenção">
                    </div>
                    <button class="btn-save" id="btnSalvarGrupo" style="width: auto; margin: 0; padding: 12px 20px;" onclick="salvarGrupo()">SALVAR</button>
                    <button class="btn-cancel" id="btnCancelarEdicaoGrupo" style="display: none; width: auto; margin: 0; padding: 12px 20px; border-radius: 12px;" onclick="cancelarEdicaoGrupo()">CANCELAR</button>
                </div>
                <div id="listaGruposCadastrados" style="margin-top: 15px; display: flex; flex-direction: column; gap: 5px; max-height: 150px; overflow-y: auto;">
                    <!-- Grupos renderizados aqui -->
                </div>
            </div>
            <div class="form-row">
                <div class="input-group">
                    <label>💰 Valor (R$)</label>
                    <input type="number" id="gastoValor" step="0.01" placeholder="0,00">
                </div>
                <div class="input-group">
                    <label>📝 Descrição</label>
                    <input type="text" id="gastoDescricao" placeholder="Ex: Combustível, Material">
                </div>
                <div class="input-group">
                    <label>🏷️ Grupo</label>
                    <select id="gastoGrupo">
                        <option value="">Sem grupo</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>💳 Forma de Pagamento</label>
                    <select id="gastoFormaPagamento">
                        <option value="PIX">PIX</option>
                        <option value="Dinheiro">Dinheiro</option>
                        <option value="Débito">Débito</option>
                        <option value="Crédito">Crédito</option>
                        <option value="Boleto">Boleto</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>📅 Data do Gasto</label>
                    <input type="date" id="gastoData">
                </div>
            </div>
            <button class="btn-save" id="btnSalvarGasto" onclick="salvarGasto()">💾 CADASTRAR GASTO</button>
            <button class="btn-cancel" id="btnCancelarEdicao" onclick="cancelarEdicao()" style="display: none;">❌ CANCELAR EDIÇÃO</button>
        </div>

        <div class="gastos-summary">
            <div class="filter-group">
                <div>
                    <label>📅 Data Início</label>
                    <input type="date" id="gastoDataInicio">
                </div>
                <div>
                    <label>📅 Data Fim</label>
                    <input type="date" id="gastoDataFim">
                </div>
                <button class="btn-excel" onclick="exportarExcelGastos()">📊 Exportar Excel</button>
            </div>
            <div class="total-gastos">Total: <span id="totalGastosFiltrado">R$ 0,00</span></div>
        </div>

        <div class="gastos-form" style="margin-bottom: 20px; padding: 15px 24px;">
            <div class="filter-group" style="width: 100%; display: flex; gap: 15px; flex-wrap: wrap;">
                <div style="flex: 2; min-width: 250px;">
                    <label>🔍 Buscar Gasto Cadastrado</label>
                    <input type="text" id="gastoBuscaDescricao" list="listaDescricoesGastos" placeholder="Digite para buscar gasto ou selecione na lista..." style="width: 100%;">
                    <datalist id="listaDescricoesGastos"></datalist>
                </div>
                <div style="flex: 1; min-width: 200px;">
                    <label>🏷️ Filtrar por Grupo</label>
                    <select id="filtroGrupoGasto" style="width: 100%; box-sizing: border-box;">
                        <option value="">Todos os grupos</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="gastos-form" style="margin-bottom: 20px;">
            <div class="form-title-small">📊 GASTOS POR GRUPO</div>
            <div class="charts-wrapper">
                <div class="chart-container" style="max-width: 400px; margin: 0 auto;">
                    <canvas id="chartGastosGrupo"></canvas>
                </div>
                <div class="chart-container" style="width: 100%; margin: 0 auto;">
                    <canvas id="chartGastosGrupoBar"></canvas>
                </div>
            </div>
        </div>

        <div class="gastos-table-section">
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Descrição</th>
                        <th>Grupo</th>
                        <th>Forma Pagamento</th>
                        <th>Valor</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="corpoTabelaGastos">
                </tbody>
        </div>
    </div>

    <!-- Script de Gestão de Gastos Conectado à VPS -->
    <script>
        let todosGastos = [];
        let todosGrupos = [];
        let gastoEditandoId = null;
        let grupoEditandoId = null;
        let chartPizzaInstance = null;
        let chartBarInstance = null;

        const socket = window.vpsSocket || (typeof io !== 'undefined' ? io('http://179.236.224.192:3000') : null);

        function initGastos() {
            // Inicializar datas (mês atual)
            const hoje = new Date();
            const ano = hoje.getFullYear();
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const dia = String(hoje.getDate()).padStart(2, '0');

            document.getElementById('gastoData').value = `${ano}-${mes}-${dia}`;
            document.getElementById('gastoDataInicio').value = `${ano}-${mes}-01`;
            document.getElementById('gastoDataFim').value = `${ano}-${mes}-${dia}`;

            // Listeners de filtros
            document.getElementById('gastoDataInicio').addEventListener('change', renderizar);
            document.getElementById('gastoDataFim').addEventListener('change', renderizar);
            document.getElementById('gastoBuscaDescricao').addEventListener('input', renderizar);
            document.getElementById('filtroGrupoGasto').addEventListener('change', renderizar);

            carregarDados();

            if (socket) {
                socket.on('connect', carregarDados);
                socket.on('changed_gastos_diarios', carregarDados);
                socket.on('changed_grupos_gastos', carregarDados);
            }
        }

        function carregarDados() {
            if (!socket) {
                ocultarLoading();
                return;
            }

            socket.emit('get', { path: 'grupos_gastos' }, (gruposData) => {
                todosGrupos = [];
                if (gruposData) {
                    Object.keys(gruposData).forEach(k => {
                        todosGrupos.push({ id: k, ...gruposData[k] });
                    });
                }
                atualizarSelectGrupos();
                renderizarGruposModal();

                socket.emit('get', { path: 'gastos_diarios' }, (gastosData) => {
                    todosGastos = [];
                    if (gastosData) {
                        Object.keys(gastosData).forEach(k => {
                            todosGastos.push({ id: k, ...gastosData[k] });
                        });
                    }

                    // Ordenar decrescente por data
                    todosGastos.sort((a, b) => new Date(b.data || 0) - new Date(a.data || 0));

                    atualizarDatalistDescricoes();
                    renderizar();
                    ocultarLoading();
                });
            });
        }

        function ocultarLoading() {
            const loading = document.getElementById('loading');
            if (loading) loading.style.display = 'none';
        }

        function atualizarSelectGrupos() {
            const selForm = document.getElementById('gastoGrupo');
            const selFiltro = document.getElementById('filtroGrupoGasto');
            const valForm = selForm.value;
            const valFiltro = selFiltro.value;

            selForm.innerHTML = '<option value="">Sem grupo</option>';
            selFiltro.innerHTML = '<option value="">Todos os grupos</option>';

            todosGrupos.forEach(g => {
                const opt1 = document.createElement('option');
                opt1.value = g.nome;
                opt1.textContent = g.nome;
                selForm.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = g.nome;
                opt2.textContent = g.nome;
                selFiltro.appendChild(opt2);
            });

            selForm.value = valForm;
            selFiltro.value = valFiltro;
        }

        function atualizarDatalistDescricoes() {
            const datalist = document.getElementById('listaDescricoesGastos');
            if (!datalist) return;
            const descricoes = [...new Set(todosGastos.map(g => (g.descricao || '').trim()).filter(Boolean))].sort();
            datalist.innerHTML = descricoes.map(d => `<option value="${d}">`).join('');
        }

        function renderizar() {
            const dInicio = document.getElementById('gastoDataInicio').value;
            const dFim = document.getElementById('gastoDataFim').value;
            const busca = (document.getElementById('gastoBuscaDescricao').value || '').toLowerCase().trim();
            const grupoFiltro = document.getElementById('filtroGrupoGasto').value;

            const filtrados = todosGastos.filter(g => {
                if (dInicio && g.data < dInicio) return false;
                if (dFim && g.data > dFim) return false;
                if (grupoFiltro && (g.grupo || '') !== grupoFiltro) return false;
                if (busca && !(g.descricao || '').toLowerCase().includes(busca)) return false;
                return true;
            });

            // Tabela
            const tbody = document.getElementById('corpoTabelaGastos');
            tbody.innerHTML = '';

            let total = 0;
            const porGrupo = {};

            filtrados.forEach(g => {
                const valor = parseFloat(g.valor) || 0;
                total += valor;

                const grp = g.grupo || 'Sem grupo';
                porGrupo[grp] = (porGrupo[grp] || 0) + valor;

                const dataFormatada = g.data ? g.data.split('-').reverse().join('/') : '-';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${dataFormatada}</td>
                    <td><b>${g.descricao || '-'}</b></td>
                    <td><span style="background:#f1f5f9; padding:4px 8px; border-radius:6px; font-size:12px; font-weight:600;">${g.grupo || 'Sem grupo'}</span></td>
                    <td>${g.formaPagamento || 'PIX'}</td>
                    <td style="font-weight:700; color:var(--danger);">R$ ${valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                    <td>
                        <button class="btn-action btn-edit" onclick="editarGasto('${g.id}')">✏️</button>
                        <button class="btn-action btn-delete" onclick="excluirGasto('${g.id}')">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            if (filtrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px; color:var(--text-light);">Nenhum gasto encontrado para este período/filtro.</td></tr>`;
            }

            document.getElementById('totalGastosFiltrado').textContent = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            atualizarGraficos(porGrupo);
        }

        function atualizarGraficos(porGrupo) {
            const labels = Object.keys(porGrupo);
            const data = Object.values(porGrupo);
            const cores = ['#ff7675', '#74b9ff', '#55efc4', '#fdcb6e', '#a29bfe', '#00cec9', '#e17055', '#0984e3', '#00b894', '#6c5ce7'];

            if (chartPizzaInstance) chartPizzaInstance.destroy();
            if (chartBarInstance) chartBarInstance.destroy();

            const ctxPizza = document.getElementById('chartGastosGrupo');
            if (ctxPizza && labels.length > 0) {
                chartPizzaInstance = new Chart(ctxPizza.getContext('2d'), {
                    type: 'doughnut',
                    data: {
                        labels,
                        datasets: [{
                            data,
                            backgroundColor: cores.slice(0, labels.length)
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom', labels: { font: { family: 'Outfit', size: 11 } } }
                        }
                    }
                });
            }

            const ctxBar = document.getElementById('chartGastosGrupoBar');
            if (ctxBar && labels.length > 0) {
                chartBarInstance = new Chart(ctxBar.getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels,
                        datasets: [{
                            label: 'Total por Grupo (R$)',
                            data,
                            backgroundColor: '#2ecc71',
                            borderRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: { beginAtZero: true }
                        }
                    }
                });
            }
        }

        function salvarGasto() {
            const valorInput = document.getElementById('gastoValor').value;
            const descricao = document.getElementById('gastoDescricao').value.trim();
            const grupo = document.getElementById('gastoGrupo').value;
            const formaPagamento = document.getElementById('gastoFormaPagamento').value;
            const data = document.getElementById('gastoData').value;

            const valor = parseFloat(valorInput);
            if (isNaN(valor) || valor <= 0) {
                alert('Informe um valor válido para o gasto!');
                return;
            }
            if (!descricao) {
                alert('Informe a descrição do gasto!');
                return;
            }
            if (!data) {
                alert('Informe a data do gasto!');
                return;
            }

            const payload = {
                valor,
                descricao,
                grupo: grupo || 'Sem grupo',
                formaPagamento: formaPagamento || 'PIX',
                data,
                createdAt: new Date().toISOString()
            };

            const id = gastoEditandoId || Date.now().toString();

            socket.emit('set', { path: `gastos_diarios/${id}`, payload }, () => {
                alert(gastoEditandoId ? 'Gasto atualizado com sucesso! ✅' : 'Gasto cadastrado com sucesso! ✅');
                cancelarEdicao();
                carregarDados();
            });
        }

        function editarGasto(id) {
            const g = todosGastos.find(item => item.id === id);
            if (!g) return;

            gastoEditandoId = id;
            document.getElementById('gastoValor').value = g.valor;
            document.getElementById('gastoDescricao').value = g.descricao || '';
            document.getElementById('gastoGrupo').value = g.grupo || '';
            document.getElementById('gastoFormaPagamento').value = g.formaPagamento || 'PIX';
            document.getElementById('gastoData').value = g.data || '';

            document.getElementById('tituloFormularioGasto').textContent = '✏️ Editar Gasto';
            document.getElementById('btnSalvarGasto').textContent = '💾 ATUALIZAR GASTO';
            document.getElementById('btnCancelarEdicao').style.display = 'block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicao() {
            gastoEditandoId = null;
            document.getElementById('gastoValor').value = '';
            document.getElementById('gastoDescricao').value = '';
            document.getElementById('gastoGrupo').value = '';
            document.getElementById('gastoFormaPagamento').value = 'PIX';

            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('gastoData').value = hoje;

            document.getElementById('tituloFormularioGasto').textContent = '➕ Cadastrar Novo Gasto';
            document.getElementById('btnSalvarGasto').textContent = '💾 CADASTRAR GASTO';
            document.getElementById('btnCancelarEdicao').style.display = 'none';
        }

        function excluirGasto(id) {
            if (!confirm('Deseja realmente excluir este gasto?')) return;
            socket.emit('remove', `gastos_diarios/${id}`, () => {
                carregarDados();
            });
        }

        // Gestão de Grupos
        function toggleFormGrupo() {
            const form = document.getElementById('formNovoGrupo');
            form.style.display = form.style.display === 'none' ? 'flex' : 'none';
        }

        function salvarGrupo() {
            const nomeInput = document.getElementById('novoGrupoNome');
            const nome = nomeInput.value.trim().toUpperCase();
            if (!nome) {
                alert('Digite o nome do grupo!');
                return;
            }

            const id = grupoEditandoId || Date.now().toString();
            socket.emit('set', { path: `grupos_gastos/${id}`, payload: { nome } }, () => {
                nomeInput.value = '';
                cancelarEdicaoGrupo();
                carregarDados();
            });
        }

        function editarGrupo(id, nome) {
            grupoEditandoId = id;
            document.getElementById('novoGrupoNome').value = nome;
            document.getElementById('lblNovoGrupo').textContent = 'Editar Grupo';
            document.getElementById('btnSalvarGrupo').textContent = 'ATUALIZAR';
            document.getElementById('btnCancelarEdicaoGrupo').style.display = 'inline-block';
        }

        function cancelarEdicaoGrupo() {
            grupoEditandoId = null;
            document.getElementById('novoGrupoNome').value = '';
            document.getElementById('lblNovoGrupo').textContent = 'Novo Grupo';
            document.getElementById('btnSalvarGrupo').textContent = 'SALVAR';
            document.getElementById('btnCancelarEdicaoGrupo').style.display = 'none';
        }

        function excluirGrupo(id) {
            if (!confirm('Deseja excluir este grupo?')) return;
            socket.emit('remove', `grupos_gastos/${id}`, () => {
                carregarDados();
            });
        }

        function renderizarGruposModal() {
            const lista = document.getElementById('listaGruposCadastrados');
            if (!lista) return;
            lista.innerHTML = '';

            todosGrupos.forEach(g => {
                const div = document.createElement('div');
                div.className = 'grupo-item';
                div.innerHTML = `
                    <span class="grupo-item-nome">${g.nome}</span>
                    <div class="grupo-actions">
                        <button class="btn-action btn-edit" onclick="editarGrupo('${g.id}', '${g.nome.replace(/'/g, "\\'")}')">✏️</button>
                        <button class="btn-action btn-delete" onclick="excluirGrupo('${g.id}')">🗑️</button>
                    </div>
                `;
                lista.appendChild(div);
            });
        }

        function exportarExcelGastos() {
            const dInicio = document.getElementById('gastoDataInicio').value;
            const dFim = document.getElementById('gastoDataFim').value;
            const busca = (document.getElementById('gastoBuscaDescricao').value || '').toLowerCase().trim();
            const grupoFiltro = document.getElementById('filtroGrupoGasto').value;

            const filtrados = todosGastos.filter(g => {
                if (dInicio && g.data < dInicio) return false;
                if (dFim && g.data > dFim) return false;
                if (grupoFiltro && (g.grupo || '') !== grupoFiltro) return false;
                if (busca && !(g.descricao || '').toLowerCase().includes(busca)) return false;
                return true;
            });

            let html = `<table border="1"><thead><tr><th>Data</th><th>Descrição</th><th>Grupo</th><th>Forma Pagamento</th><th>Valor (R$)</th></tr></thead><tbody>`;
            let total = 0;

            filtrados.forEach(g => {
                const valor = parseFloat(g.valor) || 0;
                total += valor;
                const dt = g.data ? g.data.split('-').reverse().join('/') : '';
                html += `<tr><td>${dt}</td><td>${g.descricao || ''}</td><td>${g.grupo || ''}</td><td>${g.formaPagamento || ''}</td><td>${valor.toFixed(2).replace('.', ',')}</td></tr>`;
            });

            html += `<tr><td colspan="4"><b>TOTAL</b></td><td><b>${total.toFixed(2).replace('.', ',')}</b></td></tr></tbody></table>`;

            const blob = new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `gastos_${dInicio || 'todos'}_a_${dFim || 'todos'}.xls`;
            a.click();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initGastos);
        } else {
            initGastos();
        }
    </script>
</body>

</html>
