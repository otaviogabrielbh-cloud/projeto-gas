<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Painel do Entregador - Canoas Gás</title>

    <link rel="icon" type="image/x-icon"
        href="https://github.com/otaviogabrielbh-cloud/projeto-gas/raw/refs/heads/main/LOGO.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile-cards.css">
    <link rel="manifest" href="manifest.json">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">

    <style>
        .btn-editar,
        .btn-excluir,
        .col-retencao,
        #topo {
            display: none !important;
        }

        #tabelaPedidos {
            display: none !important;
        }

        #containerCardsMobile {
            display: flex !important;
        }

        .header-historico h3 {
            color: #6c5ce7;
        }

        .fixed-controls {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 2000;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .fixed-controls button {
            pointer-events: auto;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 700;
            border-radius: var(--radius-md);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: none;
            cursor: pointer;
        }

        .btn-vender-top {
            background: #2ecc71 !important;
            color: white !important;
        }

        .btn-logout-top {
            background: #ff4757 !important;
            color: white !important;
        }

        body {
            padding-top: 75px;
        }

        @media (max-width: 600px) {
            .header-historico {
                flex-direction: column;
                align-items: flex-start !important;
                gap: 15px;
            }

            #containerFiltroEntregador {
                width: 100%;
                flex-wrap: wrap;
                justify-content: flex-start;
            }

            #delivererTitle {
                font-size: 1.1rem;
                width: 100%;
            }

            .contador-pedidos {
                display: inline-block;
                margin-top: 5px;
            }

            .fixed-controls {
                top: 5px;
                right: 5px;
            }
        }

        /* Estilos para Foto do Comprovante */
        .btn-foto-anexo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #0984e3;
            color: white;
            padding: 12px;
            border-radius: 10px;
            border: none;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
            transition: all 0.2s;
        }

        .btn-foto-anexo:active {
            transform: scale(0.98);
            background: #74b9ff;
        }

        .preview-foto-container {
            position: relative;
            margin: 10px 0;
            text-align: center;
            border: 2px dashed #dfe6e9;
            border-radius: 10px;
            padding: 5px;
            background: #fdfdfd;
        }

        .preview-foto-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .btn-remove-foto {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ff7675;
            color: white;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
    </style>
    <!-- VPS Socket.IO & Adapter (Primeiros Scripts) -->
    <script src="js/socket.io.min.js"></script>
    <script>
        if (typeof io === 'undefined') {
            document.write('<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"><\/script>');
        }
    </script>
    <script src="js/vps-adapter.js"></script>
</head>

<body data-role="entregador">

    <div class="fixed-controls">
        <button class="btn-vender-top" onclick="window.abrirModalVenda()" title="Efetuar Venda">💵 Vender</button>
        <button class="btn-logout-top" onclick="window.logout()" title="Sair">🚪 Sair</button>
    </div>

    <div class="container historico-container">
        <div class="header-historico">
            <h3 id="delivererTitle">📦 Meus Pedidos <span id="totalPedidos" class="contador-pedidos">0</span> <small
                    id="refreshTimer" style="font-size: 11px; color: #888; margin-left:10px; font-weight:normal;">🔄
                    30s</small></h3>
            <div id="containerFiltroEntregador" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                <label style="margin:0; font-size: 13px; color: #666;">Status:</label>
                <select id="filtroStatusEntregador" onchange="window.renderizarTabelaPorData()">
                    <option value="pendente">🚀 PENDENTES</option>
                    <option value="concluido">✅ CONCLUÍDOS</option>
                </select>
                <label style="margin:0; font-size: 13px; color: #666;">Ordem:</label>
                <select id="filtroOrdemEntregador" onchange="window.renderizarTabelaPorData()">
                    <option value="prioridade">⚡ Prioridade / Hora</option>
                    <option value="proximidade">📍 Mais Próximos (GPS)</option>
                </select>
                <button id="btnNotificacaoPerm" onclick="window.ativarAlertasPrioritarios()"
                    style="padding: 6px 12px; font-size: 13px; background: #6c5ce7; color: white; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(108, 92, 231, 0.4);">
                    🔔 Ativar Alertas
                </button>
                <button onclick="window.testarAlerta()"
                    style="padding: 6px 12px; font-size: 13px; background: #dfe6e9; color: #2d3436; border-radius: 8px; border: none; cursor: pointer; font-weight: bold;">
                    🔊 Testar
                </button>
            </div>
        </div>

        <!-- Diagnostic (Optional, hidden by default but useful) -->
        <div id="painelDiagnostico"
            style="display:none; padding: 10px; background: #2d3436; color: white; font-size: 11px; margin: 10px 0; border-radius: 8px;">
            <div style="display: flex; justify-content: space-around; text-align: center;">
                <div>GPS<br><span id="diagGPS" style="color: #ff7675;">🔴 OFF</span></div>
                <div>WAKE LOCK<br><span id="diagWake" style="color: #ff7675;">🔴 OFF</span></div>
                <div>AUDIO/FUNDO<br><span id="diagAudio" style="color: #ff7675;">🔴 OFF</span></div>
                <div>PEDIDOS<br><span id="diagPedidos" style="font-weight: bold;">0</span></div>
            </div>
        </div>

            <div id="containerCardsMobile" class="cards-mobile-container"></div>
            <!-- Hidden table for logic reuse if needed -->
            <table id="tabelaPedidos" style="display:none;">
                <tbody id="corpoTabela"></tbody>
            </table>
        </div>
    </div>

    <!-- Modals Ported from index.html -->
    <div id="modalPedidoDetalhes" class="modal">
        <div class="modal-content" style="max-width: 450px;">
            <div class="modal-header">
                <h3>📋 Detalhes da Entrega</h3>
                <span class="close"
                    onclick="document.getElementById('modalPedidoDetalhes').style.display='none'">&times;</span>
            </div>
            <div id="detalhesConteudo"></div>
            <div class="actions-footer">
                <button id="btnIniciarEntrega" class="btn-concluir" style="background: var(--success-color);">🛵 Iniciar
                    Entrega</button>
                <button id="btnConcluirEntrega" class="btn-concluir">✅ Concluir</button>
                <button id="btnCancelarEntrega" class="btn-cancelar-entrega">❌ Cancelar</button>
            </div>
            <button class="btn-limpar" onclick="document.getElementById('modalPedidoDetalhes').style.display='none'"

        </div>
    </div>

                <h3>💰 Finalizar Entrega</h3>

            <div id="finalizarConteudo">

                <select id="pagamentoFinalizar" onchange="window.toggleQRCodePix(this.value)">
                    <option value="">-- SELECIONE --</option>
                    <option value="DINHEIRO">DINHEIRO</option>
                    <option value="PIX">PIX</option>
                    <option value="DÉBITO">DÉBITO</option>
                    <option value="CRÉDITO">CRÉDITO</option>
                    <option value="A PRAZO">A PRAZO</option>
                    <option value="ON LINE">ON LINE</option>
                    <option value="VALE GÁS/ÁGUA">VALE GÁS/ÁGUA</option>
                    <option value="PIX+CARTÃO">PIX+CARTÃO</option>
                    <option value="PIX+DINHEIRO">PIX+DINHEIRO</option>
                    <option value="DINHEIRO+CARTÃO">DINHEIRO+CARTÃO</option>
                    <option value="GAS DO POVO">GAS DO POVO</option>
                    <option value="PESQUISA">PESQUISA</option>
                    <option value="OUTRO">OUTRO</option>
                </select>

                <!-- QR Code PIX -->
                <div id="qrCodePixContainer"
                    style="display: none; text-align: center; margin: 10px 0; padding: 15px; background: #f5f5f5; border-radius: 10px; border: 1px solid #ddd;">
                    <p style="margin: 0 0 10px 0; font-weight: bold; color: #00a884; font-size: 14px;">📱 QR Code PIX
                    </p>
                    <img src="PIX.png"
                        alt="QR Code PIX"
                        style="max-width: 200px; width: 100%; border: 3px solid #00a884; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                </div>

                <!-- Foto do Comprovante -->

                    <label>📸 Comprovante de Pagamento:</label>
                    <button type="button" class="btn-foto-anexo"
                        onclick="document.getElementById('inputFotoComprovante').click()">
                        <span id="labelBotaoFoto">📷 Tirar Foto do Comprovante</span>
                    </button>
                    <input type="file" id="inputFotoComprovante" accept="image/*" capture="camera" style="display:none"
                        onchange="window.processarFotoComprovante(this)">

                    <div id="previewFotoComprovante" class="preview-foto-container" style="display: none;">
                        <button type="button" class="btn-remove-foto" onclick="window.removerFotoComprovante()">×</button>
                        <img id="imgPreviewComprovante" class="preview-foto-img" src="" alt="Preview">
                        <p style="font-size: 10px; color: #888; margin-top: 5px;">✅ Foto processada com marca d'água</p>
                    </div>
                </div>

                <label>Observação da Entrega (Opcional):</label>
                <textarea id="obsFinalizar" placeholder="Ex: Deixou com o vizinho, porteiro..."></textarea>
            </div>
            <div class="actions-footer">
                <button id="btnConfirmarFinalizacao" class="btn-concluir">Confirmar</button>
                <button class="btn-limpar"
                    onclick="document.getElementById('modalFinalizarEntrega').style.display='none'">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal Venda Direta -->
    <div id="modalVendaDireta" class="modal">
        <div class="modal-content" style="max-width: 450px;">
            <div class="modal-header">
                <h3>💵 Registrar Venda</h3>

                    onclick="document.getElementById('modalVendaDireta').style.display='none'">&times;</span>
            </div>
            <div id="vendaConteudo" style="padding: 10px 0;">
                <label>👤 Nome do Cliente:</label>
                <input type="text" id="vendaCliente" placeholder="Digite o nome..." list="listaClientesVenda"
                    style="width: 100%; margin-bottom: 15px;">
                <datalist id="listaClientesVenda"></datalist>

                <label>📞 Telefone:</label>
                <input type="text" id="vendaTelefone" placeholder="(00) 00000-0000" maxlength="15"

                    style="width: 100%; margin-bottom: 15px;">
                <datalist id="listaTelefonesVenda"></datalist>

                <label>🛒 Canal de Venda:</label>
                <select id="vendaCanal" style="width: 100%; margin-bottom: 15px;">
                    <option value="VENDA MOBILE">VENDA MOBILE</option>
                </select>

                <div style="display: flex; gap: 10px; margin-bottom: 15px;">

                            <option value="Botijão 45kg">Botijão 45kg-SUPERGASBRAS</option>
                            <option value="Botijão 13kg completo">Botijão 13kg completo</option>
                            <option value="Água Mineral completa">Água Mineral completa</option>
                            <option value="Manutenção">Manutenção</option>
                            <option value="Registro de Gás">Registro de Gás</option>
                            <option value="Botijão completo ">Botijão completo</option>
                            <option value="Registro de Gás + Mangueira">Registro de Gás + Mangueira</option>
                            <option value="Botijão 13kg completo + Mangueira">Botijão 13kg completo + Mangueira</option>
                            <option value="Botijão 13kg completo + Registro de Gás">Botijão 13kg completo + Registro de
                                Gás</option>
                            <option value="Botijão 13kg completo + Registro de Gás + Mangueira">Botijão 13kg completo +
                                Registro de Gás + Mangueira</option>
                        </select>
                    </div>
                </div>

                <select id="vendaPagamento" style="width: 100%; margin-bottom: 15px;"

                    <option value="DINHEIRO">DINHEIRO</option>

                    <option value="DÉBITO">DÉBITO</option>
                    <option value="CRÉDITO">CRÉDITO</option>

                    <option value="ON LINE">ON LINE</option>
                    <option value="VALE GÁS/ÁGUA">VALE GÁS/ÁGUA</option>
                    <option value="PIX+CARTÃO">PIX+CARTÃO</option>
                    <option value="PIX+DINHEIRO">PIX+DINHEIRO</option>
                    <option value="DINHEIRO+CARTÃO">DINHEIRO+CARTÃO</option>

    <div id="msgCopiado" class="success-msg" style="z-index: 3000; top: 10px;">Ação realizada com sucesso! ✅</div>

    <script>
        // --- Deliverer-Specific UI & Session Logic ---
        window.logout = function () {
            if (confirm("Deseja sair do sistema?")) {
                localStorage.clear();
                location.href = 'index.html';
            }
        }

        window.verificarSessao = function () {
            const role = localStorage.getItem('userRole');
            const userName = localStorage.getItem('userName');
            if (role !== 'entregador') {
                location.href = 'index.html';
                return;
            }
            document.getElementById('delivererTitle').innerHTML = `📦 Meus Pedidos (${userName}) <span id="totalPedidos" class="contador-pedidos">0</span> <small id="refreshTimer" style="font-size: 11px; color: #888; margin-left:10px; font-weight:normal;">🔄 30s</small>`;
            window.solicitarWakeLock();
            window.iniciarKeepAlive();
            window.iniciarRastreamento();

            if (window.iniciarEscutaTempoReal) window.iniciarEscutaTempoReal();
        }

        function atualizarPainelDiag(chave, status, cor) {
            const el = document.getElementById('diag' + chave);
            if (el) {
                el.innerText = status;
                el.style.color = cor;
            }
        }

        // GPS Tracking & Proximidade
        let watchId = null;
        let gpsHeartbeatId = null;
        window.posicaoEntregadorAtual = null;

        // Tentar carregar última posição do cache imediatamente
        try {
            const cachedPos = localStorage.getItem('entregador_ultima_pos');
            if (cachedPos) window.posicaoEntregadorAtual = JSON.parse(cachedPos);
        } catch (e) {}

        window.ultimaPosicaoGravadaHistorico = window.ultimaPosicaoGravadaHistorico || null;

        function getHojeLocalISO() {
            const d = new Date();
            const local = new Date(d.getTime() - (d.getTimezoneOffset() * 60000));
            return local.toISOString().split('T')[0];
        }

        window.gravarPontoHistoricoGPS = function (evento = 'manual', pedidoId = null) {
            const nome = localStorage.getItem('userName');
            if (!nome || !window.firebasePush || !window.remoteDb || !window.firebaseRef) return;
            const pos = window.posicaoEntregadorAtual;
            if (!pos || !pos.lat || !pos.lng) return;
            const agora = Date.now();
            const dataHoje = getHojeLocalISO();
            window.firebasePush(window.firebaseRef(window.remoteDb, `historico_gps/${nome}/${dataHoje}`), {
                lat: pos.lat,
                lng: pos.lng,
                accuracy: pos.accuracy || 0,
                speed: pos.speed || 0,
                timestamp: agora,
                evento: evento,
                pedidoId: pedidoId || null
            });
        };

        let gpsWatchdogId = null;
        window.ultimoGpsRecebidoTimestamp = 0;

        function processarNovaPosicaoGPS(pos, eventoForcado = null, pedidoIdForcado = null) {
            if (!pos || !pos.coords) return;
            const { latitude, longitude, accuracy, speed, heading } = pos.coords;

            window.posicaoEntregadorAtual = {
                lat: latitude,
                lng: longitude,
                accuracy: accuracy || 0,
                speed: speed || 0,
                heading: heading || 0,
                timestamp: Date.now()
            };
            window.ultimoGpsRecebidoTimestamp = Date.now();

            try {
                localStorage.setItem('entregador_ultima_pos', JSON.stringify({ lat: latitude, lng: longitude }));
            } catch (e) {}

            atualizarPainelDiag('GPS', '🟢 ON', '#55efc4');

            const nome = localStorage.getItem('userName');
            if (nome && window.firebaseUpdate && window.remoteDb && window.firebaseRef) {
                const updateData = {
                    lat: latitude,
                    lng: longitude,
                    accuracy: accuracy || 0,
                    speed: speed || 0,
                    heading: heading || 0,
                    online: true,
                    ultimaVez: Date.now(),
                    nome: nome
                };
                window.firebaseUpdate(window.firebaseRef(window.remoteDb, `status_entregadores/${nome}`), updateData);

                // Registrar histórico de rota efetiva (linha vermelha no mapa)
                const agora = Date.now();
                const dataHoje = getHojeLocalISO();
                let registrarPonto = false;

                if (eventoForcado) {
                    registrarPonto = true;
                } else if (!window.ultimaPosicaoGravadaHistorico) {
                    registrarPonto = true;
                } else {
                    const distCalc = typeof window.calcularDistanciaMetros === 'function'
                        ? window.calcularDistanciaMetros(window.ultimaPosicaoGravadaHistorico.lat, window.ultimaPosicaoGravadaHistorico.lng, latitude, longitude)
                        : 100;
                    const distM = (distCalc !== null && !isNaN(distCalc)) ? distCalc : 100;
                    const tempoMs = agora - window.ultimaPosicaoGravadaHistorico.timestamp;

                    // Critérios de gravação de ponto:
                    // 1. Deslocamento de 12 metros ou mais (moto em movimento)
                    // 2. Ou intervalo de 20s com deslocamento mínimo de 3 metros (curvas/trânsito lento)
                    // 3. Ou intervalo de 40s (batimento de presença para não criar lacunas de sinal)
                    if (distM >= 12 || (tempoMs >= 20000 && distM >= 3) || tempoMs >= 40000) {
                        registrarPonto = true;
                    }
                }

                if (registrarPonto && window.firebasePush) {
                    window.ultimaPosicaoGravadaHistorico = { lat: latitude, lng: longitude, timestamp: agora };
                    const pontoHist = {
                        lat: latitude,
                        lng: longitude,
                        timestamp: agora,
                        speed: speed || 0,
                        accuracy: accuracy || 0
                    };
                    if (eventoForcado) pontoHist.evento = eventoForcado;
                    if (pedidoIdForcado) pontoHist.pedidoId = pedidoIdForcado;

                    window.firebasePush(window.firebaseRef(window.remoteDb, `historico_gps/${nome}/${dataHoje}`), pontoHist);
                }
            }

            // Atualizar distâncias e ordenação se a função estiver disponível
            if (typeof window.atualizarDistanciasUI === 'function') {
                window.atualizarDistanciasUI();
            }
        }

        // Forçar leitura imediata de GPS (chamado ao finalizar/iniciar entrega ou acordar tela)
        window.forcarCapturaGPSImediata = function (evento = 'imediato', pedidoId = null) {

                const entregadorMatch = (p.entregador || '').trim().toUpperCase() === userName.trim().toUpperCase();
                if (!entregadorMatch) return false;

                const statusNormalizado = (p.statusEntrega || 'Pendente').trim().toUpperCase();
                const isPendente = ['PENDENTE', 'EM ROTA', 'INICIADO', 'PRIORIZAR'].includes(statusNormalizado);

                if (statusFiltro === 'pendente' && !isPendente) return false;
                if (statusFiltro === 'concluido' && isPendente) return false;

                return true;
            });

            // 2. Lógica de Alerta de Novo Pedido (Comparação de IDs)
            const pendentesAtuais = pedidos.filter(p => {
                const s = (p.statusEntrega || 'Pendente').trim().toUpperCase();
                return ['PENDENTE', 'EM ROTA', 'INICIADO', 'PRIORIZAR'].includes(s);
            });

            // Usamos um Set para comparar IDs e evitar duplicados
            const idsAtuais = pendentesAtuais.map(p => p.id);
            const pendenteAnteriorStr = localStorage.getItem('entregador_ids_pendentes') || '[]';
            const idsAnteriores = JSON.parse(pendenteAnteriorStr);

            // Se houver algum ID novo que não estava na lista anterior, dispara alerta
            const novosPedidos = idsAtuais.filter(id => !idsAnteriores.includes(id));

            if (novosPedidos.length > 0) {
                console.log("🔔 Novos pedidos detectados:", novosPedidos);
                if (window.tocarAlertaSonoro) window.tocarAlertaSonoro();

                // Mostrar banner de sistema (redundância PWA)
                if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                    navigator.serviceWorker.controller.postMessage({
                        type: 'NOTIFICAR_PEDIDO',
                        body: `🛵 ${novosPedidos.length} novo(s) pedido(s) atribuído(s) a você!`,
                        url: './entregador.html'
                    });
                }
            }

            // Salvar estado atual para a próxima comparação
            localStorage.setItem('entregador_ids_pendentes', JSON.stringify(idsAtuais));

            // 3. Iniciar resolução assíncrona de coordenadas para pedidos pendentes
            if (statusFiltro === 'pendente' && pendentesAtuais.length > 0) {
                processarFilaGeocodificacao(pendentesAtuais);
            }

            // 4. Calcular distâncias com base na posição atual do GPS
            const posAtual = window.posicaoEntregadorAtual;
            let maisProximo = null;
            let menorDistancia = Infinity;

            pedidos.forEach(p => {
                p.distanciaMetros = null;
                p.distanciaFormatada = '';

                if (p.endereco && posAtual && posAtual.lat && posAtual.lng) {
                    const cleanAddr = p.endereco
                        .replace(/\b(apto|apartamento|bloco|casa|fundos|sala|loja|quadra|lote|portaria)\b.*$/i, '')
                        .replace(/[^\w\s]/gi, ' ')
                        .replace(/\s+/g, ' ')
                        .trim()
                        .toUpperCase();
                    const coords = window.coordenadasMemoriaCache[cleanAddr];
                    if (coords && coords.lat && coords.lng) {
                        const dist = window.calcularDistanciaMetros(posAtual.lat, posAtual.lng, coords.lat, coords.lng);
                        if (dist !== null && !isNaN(dist)) {
                            p.distanciaMetros = dist;
                            p.distanciaFormatada = window.formatarDistancia(dist);

                            const s = (p.statusEntrega || 'Pendente').trim().toUpperCase();
                            const isPendente = ['PENDENTE', 'EM ROTA', 'INICIADO', 'PRIORIZAR'].includes(s);
                            if (isPendente && dist < menorDistancia) {
                                menorDistancia = dist;
                                maisProximo = p;
                            }
                        }
                    }
                }
            });

            // 5. Renderizar banner da entrega mais próxima
            if (statusFiltro === 'pendente' && pendentesAtuais.length > 0) {
                const sugestao = maisProximo || pendentesAtuais[0];
                renderizarBannerSugestao(sugestao);
            } else {
                renderizarBannerSugestao(null);
            }

            // 6. Ordenar lista
            if (ordemFiltro === 'proximidade') {
                pedidos.sort((a, b) => {
                    const aPrio = (a.statusEntrega || '').trim().toUpperCase() === 'PRIORIZAR' ? 1 : 0;
                    const bPrio = (b.statusEntrega || '').trim().toUpperCase() === 'PRIORIZAR' ? 1 : 0;
                    if (aPrio !== bPrio) return bPrio - aPrio;

                    const aDist = a.distanciaMetros !== null ? a.distanciaMetros : Infinity;
                    const bDist = b.distanciaMetros !== null ? b.distanciaMetros : Infinity;
                    if (aDist !== bDist) return aDist - bDist;

                    return (b.timestamp || 0) - (a.timestamp || 0);
                });
            } else {
                // Padrão: PRIORIZAR primeiro, depois mais recentes
                pedidos.sort((a, b) => {
                    const aPrio = (a.statusEntrega || '').trim().toUpperCase() === 'PRIORIZAR' ? 1 : 0;
                    const bPrio = (b.statusEntrega || '').trim().toUpperCase() === 'PRIORIZAR' ? 1 : 0;
                    if (aPrio !== bPrio) return bPrio - aPrio;
                    return (b.timestamp || 0) - (a.timestamp || 0);
                });
            }

            // 7. Renderizar a Tela
            container.innerHTML = '';
            document.getElementById('totalPedidos').innerText = pedidos.length;

            if (pedidos.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 40px 20px; color: #888;">
                    <p style="font-size: 32px; margin-bottom: 10px;">🛵</p>
                    <p style="font-weight: 600;">Nenhum pedido ${statusFiltro === 'pendente' ? 'pendente' : 'concluído'} no momento.</p>
                </div>`;
                return;
            }

            pedidos.forEach(p => {
                const isMaisPerto = maisProximo && p.id === maisProximo.id;
                container.appendChild(criarCardPedido(p, isMaisPerto));
            });
        };

        function calcularTempo(timestamp) {
            if (!timestamp) return '0 min';
            const diff = Date.now() - timestamp;
            const min = Math.floor(diff / 60000);
            return `${min} min`;
        }

        function getClassCorTempo(timestamp) {
            if (!timestamp) return 'tempo-recente'; // Verde
            const diff = Date.now() - timestamp;
            const min = Math.floor(diff / 60000);

            if (min < 30) return 'tempo-recente'; // < 30 min (Verde)
            if (min < 60) return 'tempo-atencao'; // 30-60 min (Amarelo)
            return 'tempo-urgente'; // > 60 min (Vermelho)
        }

            // Calcular tempo e cor
            const tempoDecorrido = calcularTempo(p.timestamp);
            const classeTempo = getClassCorTempo(p.timestamp);
            const isFinalizado = status === 'Concluída' || status === 'Cancelada';

            // Aplicar classe de tempo se não for finalizado
            if (!isFinalizado) {

                card.classList.add('prioridade');

            const badgeMaisPertoHtml = (isMaisProximo && !isFinalizado) ? `<span class="badge-mais-proximo">🎯 MAIS PERTO</span>` : '';

        window.processarFotoComprovante = function (input, contexto = '') {
            if (!input.files || !input.files[0]) return;

            const file = input.files[0];
            const reader = new FileReader();

            window.mostrarMensagemSucesso("⚙️ Processando imagem...");

            reader.onload = function (e) {
                const img = new Image();
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    // Redimensionar (Max 800px)
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Adicionar Marca d'Água
                    const dataHora = new Date().toLocaleString('pt-BR');
                    const entregador = localStorage.getItem('userName') || 'Entregador';
                    const texto = `Canoas Gás | ${dataHora} | ${entregador}`;

                    ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                    ctx.fillRect(0, height - 25, width, 25);

                    ctx.fillStyle = "white";
                    ctx.font = "bold 12px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(texto, width / 2, height - 8);

                    // Converter para Blob para upload e URL para preview
                    canvas.toBlob(function (blob) {
                        const suffix = contexto === 'Venda' ? 'Venda' : '';
                        const blobProp = contexto === 'Venda' ? 'fotoVendaBlob' : 'fotoComprovanteBlob';
                        
                        window[blobProp] = blob;
                        const url = URL.createObjectURL(blob);

                        const imgEl = document.getElementById('imgPreview' + (contexto === 'Venda' ? 'Venda' : 'Comprovante'));
                        const containerEl = document.getElementById('previewFoto' + (contexto === 'Venda' ? 'Venda' : 'Comprovante'));
                        const labelEl = document.getElementById('labelBotaoFoto' + (contexto === 'Venda' ? 'Venda' : ''));

                        if (imgEl) imgEl.src = url;
                        if (containerEl) containerEl.style.display = 'block';
                        if (labelEl) labelEl.innerText = "📷 Trocar Foto";
                        
                        window.mostrarMensagemSucesso("✅ Foto pronta!");
                    }, 'image/jpeg', 0.6);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        window.removerFotoComprovante = function (contexto = '') {
            const suffix = contexto === 'Venda' ? 'Venda' : '';
            const blobProp = contexto === 'Venda' ? 'fotoVendaBlob' : 'fotoComprovanteBlob';
            const inputId = contexto === 'Venda' ? 'inputFotoVenda' : 'inputFotoComprovante';

        window.uploadComprovanteImgBB = async function (blob) {

            // --- API KEY IMGBB ---
            const API_KEY = "a73655b7a9da96154c7ef383a3535959";

            const formData = new FormData();
            formData.append('image', blob);

            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.success) {
                    return result.data.url;
                } else {

        // === MÁSCARA E AUTOCOMPLETE PARA VENDA ===
        window.mascaraTelefoneVenda = function (campo) {
            let valor = campo.value.replace(/\D/g, "");
            if (valor.length > 0) valor = "(" + valor;
            if (valor.length > 3) valor = valor.slice(0, 3) + ") " + valor.slice(3);
            if (valor.length > 10) valor = valor.slice(0, 10) + "-" + valor.slice(10, 15);
            else if (valor.length > 9) valor = valor.slice(0, 9) + "-" + valor.slice(9);
            campo.value = valor;

            // Buscar último pedido quando telefone completo
            if (valor.length >= 14) {
                window.buscarClientePorTelefoneVenda(valor);
            }
        }

        window.buscarClientePorTelefoneVenda = function (tel) {
            if (!window.pedidosCache) return;

            const ultimo = [...window.pedidosCache].reverse().find(p => p.telefone === tel);
            if (ultimo) {
                document.getElementById('vendaCliente').value = ultimo.cliente || '';
                window.mostrarMensagemSucesso("✅ Cliente encontrado!");
            }
        }

            let valor = campo.value.replace(/\D/g, "");
            valor = (valor / 100).toFixed(2) + "";
            valor = valor.replace(".", ",");
            valor = valor.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
            campo.value = valor;

        function atualizarDatalistVenda() {
            const listNomes = document.getElementById('listaClientesVenda');
            const listTels = document.getElementById('listaTelefonesVenda');

            if (!listNomes || !listTels) return;

            listNomes.innerHTML = '';
            listTels.innerHTML = '';

            if (!window.pedidosCache) return;

            const nomes = new Set();
            const tels = new Set();

            if (window.pedidosCache) {
                window.pedidosCache.forEach(p => {
                    if (p.cliente) nomes.add(p.cliente.trim().toUpperCase());
                    if (p.telefone) tels.add(p.telefone.trim());
                });
            }

            if (window.clientesCadastradosGlobais) {
                Object.values(window.clientesCadastradosGlobais).forEach(c => {
                    if (c.nome) nomes.add(c.nome.trim().toUpperCase());
                    if (c.cliente) nomes.add(c.cliente.trim().toUpperCase());
                    if (c.tel) tels.add(c.tel.trim());
                    if (c.telefone) tels.add(c.telefone.trim());
                });
            }

            nomes.forEach(n => {
                const opt = document.createElement('option');
                opt.value = n;
                listNomes.appendChild(opt);
            });

            tels.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                listTels.appendChild(opt);
            });
        }

        // === VENDA DIRETA FUNCTIONS ===
        window.abrirModalVenda = function () {
            // Atualizar listas de autocomplete
            atualizarDatalistVenda();

            // Limpar campos
            document.getElementById('vendaCliente').value = '';
            document.getElementById('vendaTelefone').value = '';
            document.getElementById('vendaCanal').value = 'VENDA MOBILE';
            document.getElementById('vendaQtd').value = '1';
            document.getElementById('vendaProduto').value = 'Gás 13kg';
            document.getElementById('vendaPagamento').value = '';
            document.getElementById('vendaValor').value = '';

            // Esconder QR Code e Foto por padrão
            if (document.getElementById('qrCodePixVendaContainer')) {
                document.getElementById('qrCodePixVendaContainer').style.display = 'none';
            }
            if (document.getElementById('containerFotoVenda')) {
                document.getElementById('containerFotoVenda').style.display = 'none';
                window.removerFotoComprovante('Venda');
            }

            // Abrir modal
            document.getElementById('modalVendaDireta').style.display = 'block';
        }

        async function capturarGPS() {
            return new Promise((resolve) => {
                if (!('geolocation' in navigator)) {
                    console.warn('GPS não disponível');
                    resolve({ lat: 0, lng: 0 });
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        resolve({
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude
                        });
                    },
                    (err) => {
                        console.warn('Erro ao capturar GPS:', err);
                        resolve({ lat: 0, lng: 0 });
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            });
        }

        async function decrementarEstoque(produto, quantidade) {
            try {
                // get já importado no topo do módulo
                const hojeChave = new Date().toLocaleDateString('pt-BR').replace(/\//g, '-');
                const estoqueRef = ref(remoteDb, 'estoque_v2/' + hojeChave);

                // Ler estoque atual
                const snapshot = await get(estoqueRef);
                if (!snapshot.exists()) {
                    console.warn('Estoque do dia não encontrado. Venda registrada sem decremento.');
                    return;
                }

                const estoqueAtual = snapshot.val();
                let updates = {};

                // Determinar qual campo decrementar
                if (produto.includes('Gás 13kg')) {
                    updates.init_g13_cheio = Math.max(0, (estoqueAtual.init_g13_cheio || 0) - quantidade);
                } else if (produto.includes('Água')) {
                    updates.init_agua_cheia = Math.max(0, (estoqueAtual.init_agua_cheia || 0) - quantidade);
                }

                // Atualizar Firebase
                await update(estoqueRef, updates);
                console.log('✅ Estoque decrementado:', updates);
            } catch (error) {
                console.error('Erro ao decrementar estoque:', error);
            }
        }

        window.salvarVendaDireta = async function () {
            const cliente = document.getElementById('vendaCliente').value.trim();
            const telefone = document.getElementById('vendaTelefone').value.trim();
            const canal = document.getElementById('vendaCanal').value;
            const qtd = parseInt(document.getElementById('vendaQtd').value) || 1;
            const produto = document.getElementById('vendaProduto').value;
            const pagamento = document.getElementById('vendaPagamento').value;
            const valor = document.getElementById('vendaValor').value.trim();
            const entregador = localStorage.getItem('userName');

            // Validações
            if (!cliente) {
                alert('Preencha o nome do cliente!');
                return;
            }
            if (!pagamento) {
                alert('Selecione a forma de pagamento!');
                return;
            }
            if (!valor) {
                alert('Preencha o valor da venda!');
                return;
            }

            const btn = document.getElementById('btnConfirmarVenda');
            const isDinheiro = pagamento.toUpperCase().includes('DINHEIRO');

            try {
                // Se não for DINHEIRO e tiver foto, fazer upload
                let fotoUrl = null;
                if (!isDinheiro && window.fotoVendaBlob) {
                    btn.disabled = true;
                    btn.innerText = "⏳ Enviando Foto...";
                    fotoUrl = await window.uploadComprovanteImgBB(window.fotoVendaBlob);

                    if (!fotoUrl) {
                        alert("❌ Erro ao enviar a foto. Tente novamente ou finalize sem foto.");
                        btn.disabled = false;
                        btn.innerText = "Confirmar Venda";
                        return;
                    }
                }

                btn.disabled = true;
                btn.innerText = "⏳ Salvando...";

                // Capturar GPS
                window.mostrarMensagemSucesso('📍 Capturando localização...');
                const gps = await capturarGPS();

                // Criar objeto de pedido
                const now = new Date();
                const dataFormatada = now.toLocaleDateString('pt-BR') + ', ' + now.toLocaleTimeString('pt-BR');

                const pedido = {
                    cliente: cliente,
                    telefone: telefone || '-',
                    endereco: 'VENDA MOBILE', // Canal fixo
                    produto: `${qtd}x ${produto}`,
                    qtd: qtd,
                    pagamento: pagamento,
                    valor: valor,
                    entregador: entregador,
                    canal: 'VENDA ENTREGADOR',
                    tipoVenda: 'VENDA MOBILE',
                    statusEntrega: 'Concluída',
                    data: dataFormatada,
                    timestamp: Date.now(),
                    gps: gps,
                    tempo_concluido: dataFormatada,
                    informacoes: `Venda direta - VENDA MOBILE`,
                    foto_comprovante: fotoUrl || null
                };

                // push importado no topo do módulo

                // Salvar no Firebase
                const pedidosRef = ref(remoteDb, 'pedidos_realtime');
                await push(pedidosRef, pedido);

                // Decrementar estoque
                await decrementarEstoque(produto, qtd);

                // Fechar modal e mostrar sucesso
                document.getElementById('modalVendaDireta').style.display = 'none';
                window.mostrarMensagemSucesso('✅ Venda registrada com sucesso!');

                console.log('✅ Venda salva:', pedido);
            } catch (error) {
                console.error('Erro ao salvar venda:', error);
                alert('Erro ao registrar venda: ' + error.message);
            } finally {
                const btn = document.getElementById('btnConfirmarVenda');
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = "Confirmar Venda";
                }
            }
        }

        // Initial timer
        let countdown = 30;
        setInterval(() => {
            countdown--;
            if (document.getElementById('refreshTimer')) document.getElementById('refreshTimer').innerText = `🔄 ${countdown}s`;
            if (countdown <= 0) { countdown = 30; window.renderizarTabelaPorData(); }
        }, 1000);

        window.verificarSessao();
    </script>
</body>
